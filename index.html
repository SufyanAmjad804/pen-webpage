<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INKCRAFT – Luxury Pens</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --black: #0a0a0a;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --cream: #f5f0e8;
      --white: #ffffff;
      --gray: #888;
      --section-pad: 80px 40px;
    }
 
    html { scroll-behavior: smooth; }
 

<body>
    {
      font-family: 'Cormorant Garamond', serif;
      background-color: var(--black);
      color: var(--cream);
      overflow-x: hidden;
    }
 
    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
 
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      letter-spacing: 6px;
      color: var(--gold);
      text-transform: uppercase;
    }
 
    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }
 
    .nav-links a {
      text-decoration: none;
      color: var(--cream);
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: color 0.3s;
    }
 
    .nav-links a:hover { color: var(--gold); }
 
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
    }
 
    .hamburger span {
      display: block;
      width: 25px;
      height: 2px;
      background: var(--gold);
      transition: 0.3s;
    }
 
    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 40px 80px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at 60% 40%, #1a1408 0%, #0a0a0a 70%);
    }
 
    .hero::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
 
    /* Decorative pen SVG */
    .pen-illustration {
      position: absolute;
      right: 8%;
      top: 50%;
      transform: translateY(-50%) rotate(-30deg);
      opacity: 0.12;
      width: 300px;
    }
 
    .hero-content { position: relative; z-index: 2; max-width: 700px; }
 
    .hero-eyebrow {
      font-size: 0.75rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
      display: block;
      animation: fadeUp 0.8s ease both;
    }
 
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.1;
      margin-bottom: 24px;
      animation: fadeUp 0.8s 0.2s ease both;
    }
 
    .hero h1 em {
      font-style: italic;
      color: var(--gold);
    }
 
    .hero p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 300;
      color: rgba(245,240,232,0.7);
      max-width: 500px;
      margin: 0 auto 40px;
      animation: fadeUp 0.8s 0.4s ease both;
      line-height: 1.8;
    }
 
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 0.8s 0.6s ease both;
    }
 
    .btn {
      padding: 14px 36px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }
 
    .btn-primary {
      background: var(--gold);
      color: var(--black);
    }
 
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
    }
 
    .btn-outline {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(245,240,232,0.4);
    }
 
    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
 
    /* ── FEATURES STRIP ── */
    .features-strip {
      display: flex;
      justify-content: center;
      gap: 0;
      border-top: 1px solid rgba(201,168,76,0.2);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
 
    .feature-item {
      flex: 1;
      padding: 32px 24px;
      text-align: center;
      border-right: 1px solid rgba(201,168,76,0.15);
      max-width: 300px;
    }
 
    .feature-item:last-child { border-right: none; }
 
    .feature-icon {
      font-size: 1.8rem;
      margin-bottom: 10px;
      display: block;
    }
 
    .feature-item h4 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--gold);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
 
    .feature-item p {
      font-size: 0.85rem;
      color: var(--gray);
      font-weight: 300;
    }
 
    /* ── COLLECTION ── */
    .collection {
      padding: var(--section-pad);
      max-width: 1200px;
      margin: 0 auto;
    }
 
    .section-header {
      text-align: center;
      margin-bottom: 60px;
    }
 
    .section-label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
 
    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      margin-bottom: 16px;
    }
 
    .section-header p {
      color: var(--gray);
      font-size: 1.05rem;
      font-weight: 300;
    }
 
    .divider {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 20px auto 0;
    }
 
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }
 
    .card {
      background: #111;
      border: 1px solid rgba(201,168,76,0.12);
      overflow: hidden;
      transition: transform 0.4s, border-color 0.4s;
      position: relative;
    }
 
    .card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
    }
 
    .card-img {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      background: linear-gradient(135deg, #1a1a1a, #111);
      position: relative;
      overflow: hidden;
    }
 
    .card-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 60%, #111 100%);
    }
 
    .card-badge {
      position: absolute;
      top: 16px; right: 16px;
      background: var(--gold);
      color: var(--black);
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 10px;
      z-index: 1;
    }
 
    .card-body { padding: 24px; }
 
    .card-body h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      margin-bottom: 6px;
    }
 
    .card-body .subtitle {
      font-size: 0.8rem;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
 
    .card-body p {
      font-size: 0.95rem;
      color: var(--gray);
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 20px;
    }
 
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-top: 1px solid rgba(201,168,76,0.1);
    }
 
    .price {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--gold);
    }
 
    .card-btn {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cream);
      background: none;
      border: 1px solid rgba(245,240,232,0.3);
      padding: 8px 18px;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      transition: all 0.3s;
    }
 
    .card-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--black);
    }
 
    /* ── BANNER ── */
    .banner {
      background: linear-gradient(135deg, #1a1306 0%, #0f0c02 100%);
      border-top: 1px solid rgba(201,168,76,0.2);
      border-bottom: 1px solid rgba(201,168,76,0.2);
      padding: 80px 40px;
      text-align: center;
    }
 
    .banner h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin-bottom: 16px;
    }
 
    .banner h2 span { color: var(--gold); font-style: italic; }
 
    .banner p {
      color: var(--gray);
      max-width: 560px;
      margin: 0 auto 36px;
      font-size: 1.05rem;
      line-height: 1.8;
      font-weight: 300;
    }
 
    /* ── SPECS ── */
    .specs {
      padding: var(--section-pad);
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
 
    .spec-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10rem;
      background: radial-gradient(circle at center, #1a1408 0%, #0a0a0a 70%);
      border: 1px solid rgba(201,168,76,0.15);
      min-height: 380px;
    }
 
    .specs-list { list-style: none; }
 
    .specs-list li {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 1rem;
    }
 
    .spec-key {
      color: var(--gray);
      font-weight: 300;
      letter-spacing: 1px;
    }
 
    .spec-val {
      color: var(--gold);
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }
 
    /* ── FOOTER ── */
    footer {
      background: #050505;
      border-top: 1px solid rgba(201,168,76,0.15);
      padding: 60px 60px 30px;
    }
 
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 50px;
    }
 
    .footer-brand .logo { font-size: 1.3rem; display: block; margin-bottom: 16px; }
 
    .footer-brand p {
      color: var(--gray);
      font-size: 0.9rem;
      line-height: 1.8;
      font-weight: 300;
      max-width: 280px;
    }
 
    .footer-col h5 {
      font-family: 'Playfair Display', serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
    }
 
    .footer-col ul { list-style: none; }
 
    .footer-col ul li {
      margin-bottom: 10px;
    }
 
    .footer-col ul li a {
      text-decoration: none;
      color: var(--gray);
      font-size: 0.9rem;
      transition: color 0.3s;
    }
 
    .footer-col ul li a:hover { color: var(--cream); }
 
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
 
    .footer-bottom p {
      color: var(--gray);
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
 
    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* ══════════════════════════════
       MEDIA QUERIES
    ══════════════════════════════ */
 
    /* Tablet – 1024px */
    @media (max-width: 1024px) {
      nav { padding: 18px 30px; }
 
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
 
      .specs {
        grid-template-columns: 1fr;
        gap: 40px;
      }
 
      .spec-visual { min-height: 260px; font-size: 7rem; }
 
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 30px; }
    }
 
    /* Large Mobile – 768px */
    @media (max-width: 768px) {
      :root { --section-pad: 60px 24px; }
 
      nav { padding: 16px 24px; }
 
      .nav-links { display: none; }
      .nav-links.open {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 64px; left: 0; right: 0;
        background: rgba(10,10,10,0.98);
        padding: 30px 24px;
        gap: 24px;
        border-bottom: 1px solid rgba(201,168,76,0.2);
      }
 
      .hamburger { display: flex; }
 
      .hero { padding: 110px 24px 60px; }
 
      .pen-illustration { display: none; }
 
      .features-strip {
        flex-direction: column;
      }
 
      .feature-item {
        border-right: none;
        border-bottom: 1px solid rgba(201,168,76,0.15);
        max-width: 100%;
      }
 
      .feature-item:last-child { border-bottom: none; }
 
      .cards-grid { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
 
      .specs { padding: 60px 24px; }
 
      .footer-grid { grid-template-columns: 1fr; }
      .footer-brand p { max-width: 100%; }
      footer { padding: 40px 24px 24px; }
 
      .footer-bottom { flex-direction: column; gap: 10px; text-align: center; }
    }
 
    /* Small Mobile – 480px */
    @media (max-width: 480px) {
      .logo { font-size: 1.2rem; letter-spacing: 4px; }
 
      .btn-group { flex-direction: column; align-items: center; }
      .btn { width: 100%; max-width: 280px; text-align: center; }
 
      .card-img { height: 180px; font-size: 4rem; }
 
      .banner { padding: 60px 20px; }
 
      .spec-visual { font-size: 5rem; min-height: 200px; }
    }
  </style>
</head>
<body>
<!-- NAV -->
  <nav>
    <span class="logo">Inkcraft</span>
    <ul class="nav-links" id="navLinks">
      <li><a href="#collection">Collection</a></li>
      <li><a href="#specs">Craftsmanship</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
 
  <!-- HERO -->

  <!-- HERO -->
  <section class="hero">
    <svg class="pen-illustration" viewBox="0 0 80 600" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="28" y="0" width="24" height="440" rx="12" fill="#c9a84c"/>
      <polygon points="28,440 52,440 40,600" fill="#a07830"/>
      <rect x="26" y="430" width="28" height="16" rx="2" fill="#e8c97a"/>
      <rect x="30" y="10" width="4" height="420" rx="2" fill="rgba(255,255,255,0.15)"/>
    </svg>
    <div class="hero-content">
      <span class="hero-eyebrow">Est. 1897 · Handcrafted Excellence</span>
      <h1>Write with <em>Grace</em>,<br/>Speak with Ink</h1>
      <p>Every Inkcraft pen is a testament to timeless artisanship — forged from the finest materials, balanced for the discerning hand.</p>
      <div class="btn-group">
        <a href="#collection" class="btn btn-primary">Explore Collection</a>
        <a href="#specs" class="btn btn-outline">Our Craft</a>
      </div>
    </div>
  </section>
</html>
